name: Generate Datas

on:
  schedule:
    # executa a cada 12 horas
    - cron: "* */12 * * *"
  
  # permite rodar manualmente
  workflow_dispatch:
  
  # executa a cada push na branch main
  push:
    branches:
    - main

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # Gera a animação da cobrinha
      - uses: Platane/snk@v3
        with:
          # nome de usuário do github para ler o gráfico de contribuições
          github_user_name: ${{ github.repository_owner }}

          # lista de arquivos para gerar
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Faz push dos arquivos gerados para a branch output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
